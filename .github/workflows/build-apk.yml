name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      
      - name: Init Bubblewrap
        run: |
          bubblewrap init --manifest=https://yatzy200011-spec.github.io/Inventoryapp/manifest.json --output=app
      
      - name: Build APK
        run: |
          cd app
          bubblewrap build --skip-download
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/*.apk
